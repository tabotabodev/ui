name: Deploy showcase to GitHub Pages

# Publishes, from the latest main:
#   https://tabotabodev.github.io/ui/      the Wasm build of the showcase app
#   https://tabotabodev.github.io/ui/api/  the Dokka API reference
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job may write to Pages; nothing else gets write access.
permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but never cancels a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS so Dokka can analyse the iOS source sets too (free for public repositories).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build Wasm showcase and API reference
        run: ./gradlew :webApp:wasmJsBrowserDistribution :tabotabo-ui:dokkaGeneratePublicationHtml -q
      - name: Assemble site
        run: |
          mkdir -p build/site
          cp -R webApp/build/dist/wasmJs/productionExecutable/. build/site/
          cp -R ui-lib/build/dokka/html build/site/api
          # Source maps stay out of the public site.
          find build/site -name '*.map' -delete
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
