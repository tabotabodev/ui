name: Publish to Maven Central

# Pushing a tag like v0.1.0 releases version 0.1.0.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest   # the iOS artifacts can only be built on macOS
    environment: maven-central
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Build releases from a clean slate: never reuse caches that other workflow runs wrote.
          cache-disabled: true

      - name: Library tests
        run: ./gradlew :tabotabo-ui:jvmTest -q

      - name: Build, sign and upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          PUBLISHING_TYPE: ${{ vars.PUBLISHING_TYPE || 'AUTOMATIC' }}
        run: scripts/publish-central.sh "${GITHUB_REF_NAME#v}"
