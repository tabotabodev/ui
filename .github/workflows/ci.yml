name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI needs no secrets and only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and non-Apple targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Library tests
        run: ./gradlew :tabotabo-ui:jvmTest -q
      - name: Compile library and showcase (Android, JVM, JS, Wasm)
        run: >
          ./gradlew -q
          :tabotabo-ui:compileAndroidMain :tabotabo-ui:compileKotlinJs :tabotabo-ui:compileKotlinWasmJs
          :shared:compileKotlinJvm :shared:compileAndroidMain :shared:compileKotlinWasmJs
          :androidApp:compileDebugKotlin :desktopApp:compileKotlin :webApp:compileKotlinWasmJs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: ui-lib/build/reports/tests

  ios:
    name: iOS targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile library and showcase for iOS
        run: ./gradlew -q :tabotabo-ui:compileKotlinIosArm64 :tabotabo-ui:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosSimulatorArm64
